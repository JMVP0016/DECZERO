# HAWAPACHA (team DecZero) - palette of the team's brand document: night blue #0B1220,
# surfaces #172234, light text #F5F7FA, turquoise #5EEAD4 (main action), amber #FBBF24 (review)
[theme]
base = "dark"
primaryColor = "#5EEAD4"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#172234"
textColor = "#F5F7FA"

[client]
# The app draws its own menu (tema.navegacion), with only the pages meant for visitors.
showSidebarNavigation = false
